<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Wallet Sign Up</title>
  <link rel="stylesheet" href="css/signup.css" />
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="wallet-icon">💼</div>
    <h1>E-Wallet</h1>
  </div>

  <div id="error-message" class="alert"></div>

  <form id="signup-form">
    <div class="input-group">
      <label for="username" class="required">Username</label>
      <input type="text" id="username" name="username" required />
    </div>

    <div class="input-group">
      <label for="email" class="required">Email Address</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div class="input-group">
      <label for="password" class="required">Password</label>
      <input type="password" id="password" name="password" required />
    </div>

    <div class="input-group">
      <label for="confirm-password" class="required">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" required />
    </div>

    <div class="input-group">
      <label for="phone_no" class="required">Phone Number</label>
      <input type="tel" id="phone_no" name="phone_no" required />
    </div>

    <div class="input-group">
      <label for="nid" class="required">National ID</label>
      <input type="text" id="nid" name="nid" required />
    </div>

    <button type="submit" class="signup-btn">Create Account</button>
  </form>

  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script src="./scripts/signup.js"></script>
</body>
</html>
