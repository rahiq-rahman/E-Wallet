<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Payment | PayEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../css/commonstyle.css">
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #F5A623;
            --success-color: #7ED321;
            --danger-color: #D0021B;
            --dark-color: #333333;
            --light-color: #F7F7F7;
            --grey-color: #9B9B9B;
        }
        
        .logo i {
            margin-right: 10px;
        }
        
        .page-title{
            margin: 24px 0;
        }

        .page-title i {
            font-size: 32px;
            margin-right: 15px;
            color: #F5A623;
            background-color: rgba(245, 166, 35, 0.1);
            padding: 10px;
            border-radius: 10px;
        }
        
        
        .btn {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #3a7bc8;
        }
        
        /* Responsive Styles */
        @media (max-width: 768px) {
            .logo {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <span class="nav-title">E-Wallet</span>
        <div class="profile-icon">
          <i class="fas fa-user"></i>
        </div>
      </nav>

    <div class="main-content"  style="background: linear-gradient(180deg, #111726 0%, #0a0e17 100%);">
        <div class="container">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        <h1 class="page-title">
            <i class="fas fa-lightbulb"></i>
            Electricity Bill Payment
        </h1>

        <div class="service-form">
            <form id="electricity-payment-form">
                <div class="form-group">
                    <label for="provider">Electricity Provider</label>
                    <select id="provider" name="provider" required>
                        <option value="">Select Provider</option>
                        <option value="provider1">National Power Company</option>
                        <option value="provider2">City Electric Service</option>
                        <option value="provider3">Metro Energy</option>
                        <option value="provider4">Regional Power Grid</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="account-number">Account Number / Customer ID</label>
                    <input type="text" id="account-number" name="account-number" placeholder="Enter your account number" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="Enter payment amount" required>
                </div>

                <div class="form-group">
                    <label for="payment-method">Payment</label>
                    <select id="payment-method" name="payment-method" required>
                        <option value="">Select Card</option>
                        <option value="card">Credit/Debit Card</option>
                        <option value="bank">Bank Transfer</option>
                    </select>
                </div>

                <button type="submit" class="btn">Pay Now</button>
            </form>
        </div>
    </div>
    </div>

    <script>
        document.getElementById('electricity-payment-form').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Payment successful! A confirmation will be sent to your email.');
            // In a real application, you would submit the form data to a server here
        });
    </script>
    <script>
        // Navigation functions
        function goBack() {
            window.location.href = '../home.html';
        }
                document
        .querySelector(".profile-icon")
        .addEventListener("click", function () {
            window.location.href = "../profile.html";
        });
    </script>
</body>
</html>
