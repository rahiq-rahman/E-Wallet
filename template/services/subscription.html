<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription Bill Payment</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/commonstyle.css" />
    <style>
      :root {
        --primary-color: #4a90e2;
        --secondary-color: #f5a623;
        --success-color: #7ed321;
        --danger-color: #d0021b;
        --dark-color: #333333;
        --light-color: #f7f7f7;
        --grey-color: #9b9b9b;
      }

      .logo i {
        margin-right: 10px;
      }

      .page-title {
        margin: 24px 0;
      }

      .page-title i {
        font-size: 32px;
        margin-right: 15px;
        color: #f5a623;
        background-color: rgba(245, 166, 35, 0.1);
        padding: 10px;
        border-radius: 10px;
      }

      .btn {
        background-color: #4a90e2;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .btn:hover {
        background-color: #3a7bc8;
      }

      /* Responsive Styles */
      @media (max-width: 768px) {
        .logo {
          margin-bottom: 15px;
        }
      }
      .hidden {
        display: none;
      }
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .section {
        background-color: #1a2235;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
        color: #e0e0e0;
        display: flex;
        align-items: center;
      }

      .section-title i {
        margin-right: 8px;
        color: #4f8eff;
      }

      .success-message {
        text-align: center;
        padding: 30px 0;
      }

      .success-icon {
        font-size: 50px;
        color: #10b981;
        margin-bottom: 15px;
      }

      .success-text {
        font-size: 20px;
        margin-bottom: 15px;
      }

      .transaction-id {
        background-color: #141c2e;
        padding: 10px 15px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 16px;
        margin: 15px 0;
        display: inline-block;
      }
      .btn {
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-block;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <span class="nav-title">E-Wallet</span>
      <div class="profile-icon">
        <i class="fas fa-user"></i>
      </div>
    </nav>

    <div
      class="main-content"
      style="background: linear-gradient(180deg, #111726 0%, #0a0e17 100%)"
    >
      <div class="container">
        <button class="back-button" onclick="goBack()">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <h1 class="page-title">
          <i class="fas fa-Subscription"></i>
          Subscription Bill Payment
        </h1>

        <div class="service-form">
          <form onsubmit="return validateForm()">
            <div class="form-group">
              <label for="provider">Subscription Provider</label>
              <select id="provider" name="provider" required>
                <option value="">Select Provider</option>
                <option value="provider1">Netflix</option>
                <option value="provider2">Amazon Prime</option>
                <option value="provider3">Spotify</option>
                <option value="provider4">YouTube Premium</option>
                <option value="provider5">Hoichoi</option>
              </select>
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter payment amount"
                required
              />
            </div>

            <button type="submit" class="btn">Pay Now</button>
          </form>
        </div>
        <!-- Payment Success Section -->
        <div id="successSection" class="section hidden">
          <div class="success-message">
            <div class="success-icon">
              <i class="fas fa-check-circle"></i>
            </div>
            <div class="success-text">Payment Successful!</div>
            <p>Your Subscription bill has been paid successfully.</p>
            <div class="transaction-id" id="transactionId">TXN123456789</div>
          </div>

          <div class="btn-group" style="justify-content: center">
            <button class="btn btn-primary" onclick="goToHome()">
              Back to Home
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("Subscription-payment-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          alert(
            "Payment successful! A confirmation will be sent to your email."
          );
          // In a real application, you would submit the form data to a server here
        });
    </script>
    <script>
      // Navigation functions
      function goBack() {
        window.location.href = "../home";
      }
      function goToHome() {
        window.location.href = "../home";
      }
      document
        .querySelector(".profile-icon")
        .addEventListener("click", function () {
          window.location.href = "../profile";
        });
    </script>
    <script>
      function validateForm() {
        const provider = document.getElementById("provider").value;

        if (provider === "") {
          alert("Please select an Subscription provider.");
          return false;
        }

        // If everything is valid, confirm payment
        confirmPayment();
        return false; // prevent actual form submission (optional, for demo)
      }

      function confirmPayment() {
        // Hide bill section
        document.querySelector(".service-form").classList.add("hidden");

        // Generate random transaction ID
        const txnId =
          "TXN" +
          Math.floor(Math.random() * 1000000000)
            .toString()
            .padStart(9, "0");
        document.getElementById("transactionId").textContent = txnId;

        // Show success section
        document.getElementById("successSection").classList.remove("hidden");
        document.getElementById("successSection").classList.add("fade-in");
      }
    </script>
  </body>
</html>
