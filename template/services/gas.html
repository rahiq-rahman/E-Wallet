<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Bill Payment | PayEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../css/commonstyle.css">
    <style>
        .page-title{
            margin: 24px 0;
        }
        
        .page-title i {
            font-size: 32px;
            margin-right: 15px;
            color: #D0021B;
            background-color: rgba(208, 2, 27, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .btn {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #3a7bc8;
        }
        
        
        /* Responsive Styles */
        @media (max-width: 768px) {     
            .logo {
                margin-bottom: 15px;
            }
        }
        
        
        
    </style>
</head>
<body>
    <nav class="nav">
        <span class="nav-title">E-Wallet</span>
        <div class="profile-icon">
          <i class="fas fa-user"></i>
        </div>
      </nav>

    <div class="main-content" style="background: linear-gradient(180deg, #111726 0%, #0a0e17 100%);">
        <div class="container">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        <h1 class="page-title">
            <i class="fas fa-fire"></i>
            Gas Bill Payment
        </h1>

        <div class="service-form">
            <form id="gas-payment-form">
                <div class="form-group">
                    <label for="provider">Gas Provider</label>
                    <select id="provider" name="provider" required>
                        <option value="">Select Provider</option>
                        <option value="provider1">National Gas Company</option>
                        <option value="provider2">City Gas Distribution</option>
                        <option value="provider3">Metro Gas Services</option>
                        <option value="provider4">Regional Gas Supply</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="account-number">Account Number / Customer ID</label>
                    <input type="text" id="account-number" name="account-number" placeholder="Enter your account number" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="Enter payment amount" required>
                </div>

                <div class="form-group">
                    <label for="payment-method">Payment</label>
                    <select id="payment-method" name="payment-method" required>
                        <option value="">Select Card</option>
                        <option value="card">Credit/Debit Card</option>
                        <option value="bank">Bank Transfer</option>
                    </select>
                </div>

                <button type="submit" class="btn">Pay Now</button>
            </form>
        </div>
    </div>
</div>

    <script>
        // Navigation functions
        function goBack() {
            window.location.href = '../home.html';
        }
              document
        .querySelector(".profile-icon")
        .addEventListener("click", function () {
          window.location.href = "../profile.html";
        });
    </script>
</body>
</html>
