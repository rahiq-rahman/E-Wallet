<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gas Bill Payment | PayEase</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/commonstyle.css" />
    <style>
      .page-title {
        margin: 24px 0;
      }

      .page-title i {
        font-size: 32px;
        margin-right: 15px;
        color: #d0021b;
        background-color: rgba(208, 2, 27, 0.1);
        padding: 10px;
        border-radius: 10px;
      }

      .btn {
        background-color: #4a90e2;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .btn:hover {
        background-color: #3a7bc8;
      }

      /* Responsive Styles */
      @media (max-width: 768px) {
        .logo {
          margin-bottom: 15px;
        }
      }

      .hidden {
        display: none;
      }
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .section {
        background-color: #1a2235;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 15px;
        color: #e0e0e0;
        display: flex;
        align-items: center;
      }

      .section-title i {
        margin-right: 8px;
        color: #4f8eff;
      }

      .success-message {
        text-align: center;
        padding: 30px 0;
      }

      .success-icon {
        font-size: 50px;
        color: #10b981;
        margin-bottom: 15px;
      }

      .success-text {
        font-size: 20px;
        margin-bottom: 15px;
      }

      .transaction-id {
        background-color: #141c2e;
        padding: 10px 15px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 16px;
        margin: 15px 0;
        display: inline-block;
      }
      .btn {
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-block;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <span class="nav-title">E-Wallet</span>
      <div class="profile-icon">
        <i class="fas fa-user"></i>
      </div>
    </nav>

    <div
      class="main-content"
      style="background: linear-gradient(180deg, #111726 0%, #0a0e17 100%)"
    >
      <div class="container">
        <button class="back-button" onclick="goBack()">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <h1 class="page-title">
          <i class="fas fa-fire"></i>
          Gas Bill Payment
        </h1>

        <div class="service-form">
          <div id="gas-payment-form">
            <div class="form-group">
              <label for="provider">Gas Provider</label>
              <select id="provider" name="provider" required>
                <option value="">Select Provider</option>
                <option value="provider1">National Gas Company</option>
                <option value="provider2">City Gas Distribution</option>
                <option value="provider3">Metro Gas Services</option>
                <option value="provider4">Regional Gas Supply</option>
              </select>
            </div>

            <div class="form-group">
              <label for="account-number">Account Number / Customer ID</label>
              <input
                type="text"
                id="account-number"
                name="account-number"
                placeholder="Enter your account number"
                required
              />
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter payment amount"
                required
              />
            </div>

            <div class="form-group">
              <label for="payment-method">Payment</label>
              <select id="payment-method" name="payment-method" required>
                <option value="">Select Card</option>
                <option value="card">Credit/Debit Card</option>
                <option value="bank">Bank Transfer</option>
              </select>
            </div>

            <button type="submit" class="btn" onclick="confirmPayment()">
              Pay Now
            </button>
        </div>
        </div>
        <!-- Payment Success Section -->
        <div id="successSection" class="section hidden">
          <div class="success-message">
            <div class="success-icon">
              <i class="fas fa-check-circle"></i>
            </div>
            <div class="success-text">Payment Successful!</div>
            <p>Your internet bill has been paid successfully.</p>
            <div class="transaction-id" id="transactionId">TXN123456789</div>
          </div>

          <div class="btn-group" style="justify-content: center">
            <button class="btn btn-primary" onclick="goToHome()">
              Back to Home
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Navigation functions
      function goBack() {
        window.location.href = "../home.html";
      }
      function goToHome() {
        window.location.href = "../home.html";
      }
      document
        .querySelector(".profile-icon")
        .addEventListener("click", function () {
          window.location.href = "../profile.html";
        });
    </script>
    <script>
      // Confirm payment
      function confirmPayment() {
        // Hide bill section
        document.querySelector(".service-form").classList.add("hidden");

        // Generate random transaction ID
        const txnId =
          "TXN" +
          Math.floor(Math.random() * 1000000000)
            .toString()
            .padStart(9, "0");
        document.getElementById("transactionId").textContent = txnId;

        // Show success section
        document.getElementById("successSection").classList.remove("hidden");
        document.getElementById("successSection").classList.add("fade-in");
      }
    </script>
  </body>
</html>
