<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Wallet Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(180deg, #111726 0%, #0A0E17 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 380px;
            background-color: #1A2235;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #ffffff;
            font-size: 28px;
            margin-top: 10px;
        }

        .wallet-icon {
            font-size: 48px;
            color: #4F8EFF;
        }
        
        form {
            display: flex;
            flex-direction: column;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #dcdcdc;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #2A3446;
            background-color: #141C2E;
            color: #ffffff;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #4F8EFF;
            outline: none;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .forgot-password a {
            color: #4F8EFF;
            text-decoration: none;
            font-size: 14px;
        }
        
        .login-btn {
            background: linear-gradient(180deg, #111726 0%, #0A0E17 100%);
            border: 1px solid #2A3446;
            color: white;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: linear-gradient(180deg, #172234 0%, #101828 100%);
            border-color: #4F8EFF;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #a0a0a0;
        }
        
        .signup-link a {
            color: #4F8EFF;
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            padding: 10px;
            background-color: rgba(220, 53, 69, 0.2);
            color: #ff6b7a;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="wallet-icon">💼</div>
            <h1>E-Wallet</h1>
        </div>
        
        <div id="error-message" class="alert"></div>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email && password) {
                window.location.href = 'home.html';
            } else {
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = 'Please enter both email and password.';
                errorMessage.style.display = 'block';
            }
        });
        document.querySelector('.signup-link a').addEventListener('click', function(event) {
            event.preventDefault();
            window.location.href = 'signup.html';
        });
    </script>
</body>
</html>
