<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile - E-Wallet</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <nav class="nav">
      <span class="nav-title">User Profile</span>
      <div class="profile-icon">
        <i class="fas fa-user"></i>
      </div>
    </nav>

    <div class="container">
      <div class="bg-element bg-element-1"></div>
      <div class="bg-element bg-element-2"></div>

      <button class="back-button" onclick="window.location.href='home.html'">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </button>

      <div class="profile-header">
        <div class="profile-avatar">
          <i class="fas fa-user"></i>
          <div class="edit-avatar">
            <i class="fas fa-camera"></i>
          </div>
        </div>
        <h1 class="profile-name">rakibhasan</h1>
        <div class="profile-email">rakib@gmail.com</div>
      </div>

      <div class="section-title">
        <i class="fas fa-user-circle"></i> User Information
      </div>

      <div class="profile-card">
        <div class="info-row">
          <div class="info-label">User ID</div>
          <div class="info-value">USR1234567</div>
        </div>
        <div class="info-row">
          <div class="info-label">Username</div>
          <div class="info-value">
            johndoe123
            <button class="btn-edit"><i class="fas fa-pencil-alt"></i></button>
          </div>
        </div>
        <div class="info-row">
          <div class="info-label">Password</div>
          <div class="info-value">
            ••••••••••
            <button class="btn-edit"><i class="fas fa-pencil-alt"></i></button>
          </div>
        </div>
        <div class="info-row">
          <div class="info-label">Phone Number</div>
          <div class="info-value">
            01999370967
            <button class="btn-edit"><i class="fas fa-pencil-alt"></i></button>
          </div>
        </div>
        <div class="info-row">
          <div class="info-label">National ID</div>
          <div class="info-value">
            8004621945
            <div class="verification-badge">
              <i class="fas fa-check-circle"></i> Verified
            </div>
          </div>
        </div>
        <div class="info-row">
          <div class="info-label">Email</div>
          <div class="info-value">
            rakib hasan
            <button class="btn-edit"><i class="fas fa-pencil-alt"></i></button>
          </div>
        </div>
      </div>

      <div class="timestamps">
        <p>Account created: March 15, 2023 at 10:23 AM</p>
        <p>Last updated: March 20, 2025 at 3:45 PM</p>
      </div>

      <button class="action-button btn-primary">
        <i class="fas fa-save"></i> Save Changes
      </button>

      <button class="action-button btn-outline">
        <i class="fas fa-cog"></i> Account Settings
      </button>

      <button class="action-button btn-danger">
        <i class="fas fa-sign-out-alt"></i> Log Out
      </button>
    </div>

    <script>
      document
        .querySelector(".back-button")
        .addEventListener("click", function () {
          window.location.href = "home.html";
        });

      document
        .querySelector(".btn-danger")
        .addEventListener("click", function () {
          if (confirm("Are you sure you want to log out?")) {
            window.location.href = "login.html";
          }
        });

      document.querySelectorAll(".btn-edit").forEach((button) => {
        button.addEventListener("click", function () {
          const infoType =
            this.closest(".info-row").querySelector(".info-label").textContent;
          alert(`Edit ${infoType} functionality would go here`);
        });
      });

      document
        .querySelector(".edit-avatar")
        .addEventListener("click", function () {
          alert("Change profile picture functionality would go here");
        });
    </script>
  </body>
</html>
